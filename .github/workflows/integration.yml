name: Continuous Integration - Test & Build

on:
  pull_request:
    branches:
      - "**"

  push:
    branches:
      - "main"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22.x]
        pnpm-version: [9.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile

      - name: Run build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22.x]
        pnpm-version: [9.x]
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/mapa
      MONGO_DB_URL: mongodb://root:password@localhost:27017/mapa-org?authSource=admin&replicaSet=rs0

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mongodb:
        image: prismagraphql/mongo-single-replica:4.4.3-bionic
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: v2-${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            v2-${{ runner.os }}-pnpm-store-

      - name: Set up Cypress binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: v2-cypress-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            v2-cypress-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm i --frozen-lockfile
        timeout-minutes: 10
      
      - name: Install Cypress binary
        run: pnpm exec cypress install
        timeout-minutes: 5

      - name: Verify Cypress installation
        run: |
          pnpm exec cypress verify
          pnpm exec cypress info
        timeout-minutes: 5

      - name: Push current migrations to test database
        run: pnpm db:push 
        timeout-minutes: 5

      - name: Seed db
        run: pnpm db:seed
        timeout-minutes: 3

      - name: Build application
        run: pnpm run build
        timeout-minutes: 10

      - name: Start server in background
        run: |
          echo "Starting Next.js server..."
          pnpm run start:ci > server.log 2>&1 &
          SERVER_PID=$!
          echo $SERVER_PID > .server.pid
          echo "Server started with PID: $SERVER_PID"

          sleep 5

          if ps -p $SERVER_PID > /dev/null; then
            echo "Server process is running"
          else
            echo "Server failed to start. Log contents:"
            cat server.log
            exit 1
          fi

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server at http://localhost:3000..."
          timeout 120 bash -c '
            until curl -f http://localhost:3000 > /dev/null 2>&1; do
              echo "Still waiting...";
              sleep 2;
            done
          ' || {
            echo "Server failed to become ready. Server log:"
            cat server.log
            exit 1
          }
          echo "Server is ready!"

      - name: Run Cypress tests
        run: |
          pnpm exec cypress run \
            --spec "cypress/e2e/**/*.cy.{js,ts}" \
            --browser chrome \
            --config video=false,screenshotOnRunFailure=true \
            --reporter spec
        timeout-minutes: 15
        env:
          CYPRESS_baseUrl: http://localhost:3000

      - name: Stop server
        if: always()
        run: |
          echo "Stopping server..."

          if [ -f .server.pid ]; then
            SERVER_PID=$(cat .server.pid)
            echo "Attempting to kill server PID: $SERVER_PID"

            kill -15 $SERVER_PID 2>/dev/null || echo "SIGTERM failed or process already dead"

            sleep 3

            if ps -p $SERVER_PID > /dev/null 2>/dev/null; then
              echo "Process still running, forcing kill..."
              kill -9 $SERVER_PID 2>/dev/null || echo "SIGKILL failed or process already dead"
            fi
          else
            echo "No .server.pid file found"
          fi

          echo "Cleaning up any remaining processes..."
          pkill -9 -f "next start" 2>/dev/null || true
          pkill -9 -f "node.*start:ci" 2>/dev/null || true
          pkill -9 -f "pnpm.*start:ci" 2>/dev/null || true

          rm -f .server.pid

          echo "Server cleanup complete"

          echo "Remaining node processes:"
          ps aux | grep -E "next|node|pnpm" | grep -v grep || echo "No node processes found"

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-logs
          path: server.log
          if-no-files-found: ignore
          retention-days: 3    